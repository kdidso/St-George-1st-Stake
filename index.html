<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>St. George YSA 1st Stake Ward Boundaries</title>

  <style>
    html, body, #map {
      height: 100%;
      width: 100%;
      margin: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    #map {
      background: #e5e7eb;
    }

    /* ---------- Title ---------- */
    .map-title {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(0,0,0,0.16);
      border-radius: 8px;
      padding: 9px 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.20);
      font-size: 18px;
      font-weight: 700;
      color: #202124;
      white-space: nowrap;
      pointer-events: none;
    }

    /* ---------- Layer control ---------- */
    .layer-panel {
      position: absolute;
      top: 72px;
      right: 12px;
      z-index: 5;
      width: 255px;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(0,0,0,0.18);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.24);
      color: #202124;
      user-select: none;
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 12px;
      cursor: pointer;
      font-weight: 700;
      border-bottom: 1px solid #e6e6e6;
    }

    .group-header:hover {
      background: #f7f7f7;
    }

    .arrow {
      width: 14px;
      display: inline-block;
      transition: transform 0.18s ease;
      font-size: 13px;
    }

    .arrow.collapsed {
      transform: rotate(-90deg);
    }

    .group-toggle {
      margin: 0;
    }

    .ward-list {
      padding: 4px 0 7px;
    }

    .ward-list.collapsed {
      display: none;
    }

    .ward-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 12px 7px 31px;
      font-size: 14px;
      cursor: pointer;
    }

    .ward-row:hover {
      background: #f6f7f8;
    }

    .ward-row input {
      margin: 0;
      flex: 0 0 auto;
    }

    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 2px solid rgba(0,0,0,0.40);
      flex: 0 0 auto;
    }

    .ward-name {
      line-height: 1.25;
    }

    .panel-footer {
      border-top: 1px solid #e6e6e6;
      padding: 9px 10px 10px;
    }

    #zoomStake {
      width: 100%;
      border: 1px solid #b8b8b8;
      border-radius: 5px;
      background: #fff;
      padding: 7px 8px;
      cursor: pointer;
      font-size: 13px;
    }

    #zoomStake:hover {
      background: #f4f4f4;
    }


    /* ---------- Search ---------- */
    .search-panel {
      position: absolute;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 7;
      width: min(460px, calc(100vw - 290px));
      min-width: 300px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.97);
      border: 1px solid rgba(0,0,0,0.18);
      border-radius: 9px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.22);
      overflow: hidden;
    }

    .search-icon {
      flex: 0 0 auto;
      padding-left: 12px;
      color: #5f6368;
      font-size: 16px;
      pointer-events: none;
    }

    #placeSearch {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      padding: 11px 10px;
      font-size: 15px;
      color: #202124;
    }

    #placeSearch::placeholder {
      color: #777;
    }

    #clearSearch {
      display: none;
      flex: 0 0 auto;
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 9px 12px;
      font-size: 19px;
      color: #666;
      line-height: 1;
    }

    #clearSearch:hover {
      background: #f2f2f2;
    }

    .search-results {
      display: none;
      margin-top: 5px;
      overflow: hidden;
      background: rgba(255,255,255,0.98);
      border: 1px solid rgba(0,0,0,0.16);
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    }

    .search-result {
      display: block;
      width: 100%;
      border: 0;
      border-bottom: 1px solid #ececec;
      background: transparent;
      padding: 9px 11px;
      text-align: left;
      cursor: pointer;
      color: #202124;
      font-size: 13px;
      line-height: 1.3;
    }

    .search-result:hover,
    .search-result:focus {
      background: #f4f7fb;
      outline: none;
    }

    .search-message {
      padding: 10px 11px;
      color: #666;
      font-size: 12px;
    }

    .search-attribution {
      padding: 6px 10px 7px;
      text-align: right;
      color: #777;
      font-size: 10px;
      background: #fafafa;
    }

    .search-attribution a {
      color: inherit;
    }

    /* ---------- Status ---------- */
    .status-box {
      position: absolute;
      left: 12px;
      bottom: 28px;
      z-index: 5;
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(0,0,0,0.16);
      border-radius: 6px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.18);
      padding: 7px 10px;
      font-size: 12px;
      color: #444;
      max-width: 320px;
    }

    .status-error {
      color: #a61b1b;
      font-weight: 700;
    }

    @media (max-width: 650px) {
      /*
        Top row: compact Google Map/Satellite control on the left,
        title on the right. Search sits immediately below that row.
      */
      .map-title {
        top: 8px;
        right: 8px;
        left: auto;
        transform: none;
        width: auto;
        max-width: 56vw;
        font-size: 12px;
        padding: 6px 8px;
        white-space: normal;
        text-align: right;
        line-height: 1.15;
        border-radius: 7px;
      }

      .search-panel {
        top: 55px;
        left: auto;
        right: 8px;
        transform: none;
        width: 68vw;
        min-width: 0;
        max-width: 430px;
      }

      .search-box {
        border-radius: 8px;
      }

      #placeSearch {
        padding: 9px 8px;
        font-size: 16px; /* prevents iOS Safari from zooming the page */
      }

      .search-icon {
        padding-left: 10px;
        font-size: 15px;
      }

      #clearSearch {
        padding: 8px 10px;
      }

      .search-results {
        max-height: 245px;
        overflow-y: auto;
      }

      /*
        Mobile legend/layer control:
        bottom-left, full-width, four columns where practical.
      */
      .layer-panel {
        top: auto;
        right: auto;
        left: 8px;
        bottom: 8px;
        width: calc(100vw - 16px);
        max-height: 46vh;
        overflow-y: auto;
        border-radius: 10px;
      }

      .group-header {
        padding: 9px 10px;
        font-size: 14px;
      }

      .ward-list {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0;
        padding: 4px 6px 6px;
      }

      .ward-list.collapsed {
        display: none;
      }

      .ward-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 5px;
        font-size: 11px;
        min-width: 0;
      }

      .ward-row input {
        flex: 0 0 auto;
      }

      .swatch {
        width: 13px;
        height: 13px;
        border-width: 1.5px;
      }

      .ward-name {
        line-height: 1.15;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .panel-footer {
        padding: 7px 8px 8px;
      }

      #zoomStake {
        width: auto;
        min-width: 120px;
        padding: 7px 10px;
        font-size: 12px;
      }

      .status-box {
        left: 8px;
        bottom: calc(46vh + 18px);
        max-width: 220px;
        font-size: 11px;
      }

      /*
        Google creates the Map/Satellite buttons dynamically.
        Make them compact enough to share the top row with the title.
      */
      .gm-style-mtc {
        margin-top: 0 !important;
      }

      .gm-style-mtc button {
        height: 34px !important;
        padding: 0 10px !important;
        font-size: 12px !important;
      }
    }

    @media (max-width: 430px) {
      .map-title {
        max-width: 57vw;
        font-size: 11px;
        padding: 6px 7px;
      }

      .search-panel {
        top: 53px;
        width: 66vw;
      }

      .ward-list {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .layer-panel {
        max-height: 50vh;
      }

      .status-box {
        bottom: calc(50vh + 18px);
      }

      .gm-style-mtc button {
        height: 32px !important;
        padding: 0 8px !important;
        font-size: 11px !important;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="map-title">St. George YSA 1st Stake Ward Boundaries</div>

  <div class="search-panel" id="searchPanel">
    <div class="search-box">
      <span class="search-icon">⌕</span>
      <input
        id="placeSearch"
        type="search"
        inputmode="search"
        autocomplete="off"
        spellcheck="false"
        aria-label="Search for an address or place"
        placeholder="Search address or place"
      />
      <button id="clearSearch" type="button" aria-label="Clear search">×</button>
    </div>
    <div class="search-results" id="searchResults" role="listbox"></div>
  </div>

  <div class="layer-panel">
    <div class="group-header" id="wardsHeader" title="Expand or collapse ward layers">
      <span class="arrow" id="wardsArrow">▼</span>
      <input type="checkbox" id="allWardsToggle" class="group-toggle" checked
             title="Turn all wards on or off" />
      <span>Wards</span>
    </div>

    <div id="wardList" class="ward-list"></div>

    <div class="panel-footer">
      <button id="zoomStake" type="button">Zoom to Stake</button>
    </div>
  </div>

  <div class="status-box" id="statusBox">Loading ward boundaries…</div>

  <script>
    let map;
    let infoWindow;
    let stakeBounds;
    let snowCanyonBounds;
    let loadedWardCount = 0;
    let searchMarker = null;
    let searchTimer = null;
    let activeSearchController = null;

    // Browser token restricted in LocationIQ to the user's GitHub Pages domain.
    const LOCATIONIQ_TOKEN = "pk.d447414bd6ee111b4987d8c82289fca3";


    /*
      Each ward is its own Google Maps Data layer, even though the layer
      control presents all of them under one expandable "Wards" group.
    */
    const wards = [
      {
        id: "greenValley",
        name: "Green Valley YSA Ward",
        ageGroup: "18-25",
        file: "Green_Valley_FeaturesToJSON.geojson",
        color: "#1976D2"
      },
      {
        id: "heights",
        name: "Heights YSA Ward",
        ageGroup: "18-25",
        file: "Heights_Ward_FeaturesToJSON.geojson",
        color: "#E65100"
      },
      {
        id: "ivins",
        name: "Ivins YSA Ward",
        ageGroup: "18-25",
        file: "Ivins_Ward_FeaturesToJSON.geojson",
        color: "#7B1FA2"
      },
      {
        id: "santaClara",
        name: "Santa Clara YSA Ward",
        ageGroup: "18-25",
        file: "Santa_Clara_Ward_FeaturesToJSON.geojson",
        color: "#F9A825"
      },
      {
        id: "snowCanyon",
        name: "Snow Canyon YSA Ward",
        ageGroup: "26-35",
        file: "Snow_Canyon_ward_FeaturesToJSON.geojson",
        color: "#00897B"
      },
      {
        id: "southGate",
        name: "Southgate YSA Ward",
        ageGroup: "18-25",
        file: "South_Gate_Ward_FeaturesToJSON.geojson",
        color: "#D81B60"
      },
      {
        id: "stGeorge1st",
        name: "St. George 1st YSA Ward",
        ageGroup: "18-25",
        file: "St_George_1st_ward_FeaturesToJSON.geojson",
        color: "#388E3C"
      },
      {
        id: "stGeorge3rd",
        name: "St. George 3rd YSA Ward",
        ageGroup: "18-25",
        file: "St_George_3rd_ward_FeaturesToJSON.geojson",
        color: "#0097A7"
      }
    ];

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 37.12, lng: -113.58 },
        zoom: 11,
        mapTypeId: "roadmap",
        mapTypeControl: true,
        streetViewControl: false,
        fullscreenControl: true,
        gestureHandling: "greedy"
      });

      infoWindow = new google.maps.InfoWindow();
      stakeBounds = new google.maps.LatLngBounds();
      snowCanyonBounds = new google.maps.LatLngBounds();

      buildLayerControl();
      initPlaceSearch();

      wards.forEach((ward) => loadWardLayer(ward));

      document.getElementById("zoomStake").addEventListener("click", () => {
        zoomToStake();
      });

      // Clicking the map closes a ward popup.
      map.addListener("click", () => {
        infoWindow.close();
        hideSearchResults();
      });
    }

    function buildLayerControl() {
      const list = document.getElementById("wardList");

      wards.forEach((ward) => {
        const row = document.createElement("label");
        row.className = "ward-row";
        row.htmlFor = "toggle-" + ward.id;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = true;
        checkbox.id = "toggle-" + ward.id;

        const swatch = document.createElement("span");
        swatch.className = "swatch";
        swatch.style.background = hexToRgba(ward.color, 0.32);
        swatch.style.borderColor = ward.color;

        const name = document.createElement("span");
        name.className = "ward-name";
        name.textContent = ward.name;

        checkbox.addEventListener("change", () => {
          ward.visible = checkbox.checked;
          if (ward.layer) {
            ward.layer.setMap(ward.visible ? map : null);
          }
          updateMasterCheckbox();
          refreshWardStyles();
        });

        row.appendChild(checkbox);
        row.appendChild(swatch);
        row.appendChild(name);
        list.appendChild(row);

        ward.checkbox = checkbox;
        ward.visible = true;
      });

      const header = document.getElementById("wardsHeader");
      const listEl = document.getElementById("wardList");
      const arrow = document.getElementById("wardsArrow");
      const master = document.getElementById("allWardsToggle");

      header.addEventListener("click", (event) => {
        // The checkbox itself controls visibility; clicking elsewhere
        // on the header expands/collapses the group.
        if (event.target === master) return;

        listEl.classList.toggle("collapsed");
        arrow.classList.toggle("collapsed");
      });

      master.addEventListener("click", (event) => {
        event.stopPropagation();
      });

      master.addEventListener("change", () => {
        wards.forEach((ward) => {
          ward.visible = master.checked;
          ward.checkbox.checked = master.checked;
          if (ward.layer) {
            ward.layer.setMap(master.checked ? map : null);
          }
        });
        master.indeterminate = false;
        refreshWardStyles();
      });
    }

    function getVisibleWardCount() {
      return wards.filter((ward) => ward.visible).length;
    }

    function getWardStyle(ward) {
      const visibleCount = getVisibleWardCount();

      /*
        Snow Canyon contains geometry that can visually cover other ward
        polygons. When more than one ward is visible, show Snow Canyon as
        outline-only. When Snow Canyon is the only visible ward, restore
        its translucent fill so the Google basemap remains visible.
      */
      const snowCanyonOutlineOnly =
        ward.id === "snowCanyon" && visibleCount > 1;

      return {
        fillColor: ward.color,
        fillOpacity: snowCanyonOutlineOnly ? 0 : 0.28,
        strokeColor: ward.color,
        strokeOpacity: 0.95,
        strokeWeight: ward.id === "snowCanyon" && visibleCount > 1 ? 3 : 2,
        clickable: true
      };
    }

    function refreshWardStyles() {
      wards.forEach((ward) => {
        if (ward.layer) {
          ward.layer.setStyle(() => getWardStyle(ward));
        }
      });
    }

    function updateMasterCheckbox() {
      const master = document.getElementById("allWardsToggle");
      const checkedCount = wards.filter((ward) => ward.checkbox.checked).length;

      master.checked = checkedCount === wards.length;
      master.indeterminate = checkedCount > 0 && checkedCount < wards.length;
    }

    function loadWardLayer(ward) {
      const layer = new google.maps.Data();
      ward.layer = layer;

      layer.setStyle(() => getWardStyle(ward));

      layer.addListener("mouseover", (event) => {
        const visibleCount = getVisibleWardCount();
        const snowCanyonOutlineOnly =
          ward.id === "snowCanyon" && visibleCount > 1;

        layer.overrideStyle(event.feature, {
          fillOpacity: snowCanyonOutlineOnly ? 0 : 0.42,
          strokeWeight: 3
        });
      });

      layer.addListener("mouseout", () => {
        layer.revertStyle();
      });

      layer.addListener("click", (event) => {
        showWardsAtLocation(event.latLng);
      });

      layer.loadGeoJson(
        ward.file,
        null,
        (features) => {
          if (!features || features.length === 0) {
            showLoadError(ward, "No features found");
            return;
          }

          features.forEach((feature) => {
            extendBoundsFromGeometry(feature.getGeometry(), stakeBounds);

            // Snow Canyon defines the outer extent of the stake.
            if (ward.id === "snowCanyon") {
              extendBoundsFromGeometry(feature.getGeometry(), snowCanyonBounds);
            }
          });

          loadedWardCount += 1;

          if (ward.visible) {
            layer.setMap(map);
          }

          updateStatus();

          // Snow Canyon represents the stake's full geographic extent,
          // so use it as the authoritative stake view whenever it loads.
          if (ward.id === "snowCanyon" && !snowCanyonBounds.isEmpty()) {
            zoomToStake();
          }
        }
      );
    }

    function zoomToStake() {
      if (!map) return;

      // Primary source: Snow Canyon's boundary, which matches the stake extent.
      if (snowCanyonBounds && !snowCanyonBounds.isEmpty()) {
        map.fitBounds(snowCanyonBounds, 35);
        return;
      }

      // Fallback in case the Snow Canyon file has not finished loading yet.
      if (stakeBounds && !stakeBounds.isEmpty()) {
        map.fitBounds(stakeBounds, 35);
      }
    }

    function extendBoundsFromGeometry(geometry, bounds) {
      if (!geometry || !bounds) return;

      /*
        Google Maps Data geometries provide forEachLatLng(), which safely
        traverses Polygon, MultiPolygon, LinearRing, and other nested
        geometry types. This is more reliable than manually checking
        geometry.getType() for every possible nested type.
      */
      geometry.forEachLatLng((latLng) => {
        bounds.extend(latLng);
      });
    }

    function initPlaceSearch() {
      const input = document.getElementById("placeSearch");
      const clearButton = document.getElementById("clearSearch");

      input.addEventListener("input", () => {
        const query = input.value.trim();
        clearButton.style.display = query ? "block" : "none";

        window.clearTimeout(searchTimer);

        if (query.length < 3) {
          hideSearchResults();
          return;
        }

        searchTimer = window.setTimeout(() => {
          runLocationSearch(query);
        }, 500);
      });

      input.addEventListener("focus", () => {
        if (input.value.trim().length >= 3) {
          runLocationSearch(input.value.trim());
        }
      });

      input.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          hideSearchResults();
          input.blur();
        }
      });

      clearButton.addEventListener("click", () => {
        input.value = "";
        clearButton.style.display = "none";
        hideSearchResults();

        if (searchMarker) {
          searchMarker.setMap(null);
          searchMarker = null;
        }

        infoWindow.close();
        input.focus();
      });
    }

    async function runLocationSearch(query) {
      const resultsBox = document.getElementById("searchResults");

      if (activeSearchController) {
        activeSearchController.abort();
      }

      activeSearchController = new AbortController();

      const params = new URLSearchParams({
        key: LOCATIONIQ_TOKEN,
        q: query,
        countrycodes: "us",
        limit: "6",
        normalizecity: "1",
        dedupe: "1",
        "accept-language": "en"
      });

      /*
        Bias results toward the actual stake extent without preventing
        someone from searching elsewhere in the United States.
      */
      if (snowCanyonBounds && !snowCanyonBounds.isEmpty()) {
        const sw = snowCanyonBounds.getSouthWest();
        const ne = snowCanyonBounds.getNorthEast();
        params.set(
          "viewbox",
          [sw.lng(), sw.lat(), ne.lng(), ne.lat()].join(",")
        );
        params.set("bounded", "0");
        params.set("importancesort", "0");
      }

      resultsBox.innerHTML =
        '<div class="search-message">Searching…</div>';
      resultsBox.style.display = "block";

      try {
        const response = await fetch(
          "https://api.locationiq.com/v1/autocomplete?" + params.toString(),
          { signal: activeSearchController.signal }
        );

        if (!response.ok) {
          throw new Error("Search request failed: " + response.status);
        }

        const results = await response.json();
        renderSearchResults(Array.isArray(results) ? results : []);
      } catch (error) {
        if (error.name === "AbortError") return;

        resultsBox.innerHTML =
          '<div class="search-message">Search is temporarily unavailable.</div>' +
          locationIqAttribution();
        resultsBox.style.display = "block";
        console.error("LocationIQ search error:", error);
      }
    }

    function renderSearchResults(results) {
      const resultsBox = document.getElementById("searchResults");
      resultsBox.innerHTML = "";

      if (results.length === 0) {
        resultsBox.innerHTML =
          '<div class="search-message">No matching places found.</div>' +
          locationIqAttribution();
        resultsBox.style.display = "block";
        return;
      }

      results.forEach((result) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "search-result";
        button.setAttribute("role", "option");
        button.textContent = result.display_name || result.name || "Search result";

        button.addEventListener("click", () => {
          selectSearchResult(result);
        });

        resultsBox.appendChild(button);
      });

      const attribution = document.createElement("div");
      attribution.className = "search-attribution";
      attribution.innerHTML =
        'Search by <a href="https://locationiq.com/" target="_blank" rel="noopener">LocationIQ</a>';
      resultsBox.appendChild(attribution);

      resultsBox.style.display = "block";
    }

    function selectSearchResult(result) {
      const lat = Number(result.lat);
      const lng = Number(result.lon);

      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

      const latLng = new google.maps.LatLng(lat, lng);
      const label = result.display_name || result.name || "Selected location";
      const input = document.getElementById("placeSearch");

      input.value = label;
      document.getElementById("clearSearch").style.display = "block";
      hideSearchResults();

      if (searchMarker) {
        searchMarker.setMap(null);
      }

      searchMarker = new google.maps.Marker({
        position: latLng,
        map: map,
        title: label
      });

      map.panTo(latLng);
      map.setZoom(17);

      window.setTimeout(() => {
        showWardsAtLocation(latLng, label);
      }, 150);
    }

    function hideSearchResults() {
      const resultsBox = document.getElementById("searchResults");
      resultsBox.style.display = "none";
    }

    function locationIqAttribution() {
      return (
        '<div class="search-attribution">' +
          'Search by <a href="https://locationiq.com/" target="_blank" rel="noopener">LocationIQ</a>' +
        '</div>'
      );
    }

    function showWardsAtLocation(latLng, locationLabel = "") {
      const matches = getWardsAtLocation(latLng);

      matches.sort((a, b) => {
        if (a.id === "snowCanyon") return -1;
        if (b.id === "snowCanyon") return 1;
        return a.name.localeCompare(b.name);
      });

      const locationHtml = locationLabel
        ? '<div style="font-size:12px;color:#555;margin-bottom:7px;max-width:260px;">' +
            escapeHtml(locationLabel) +
          '</div>'
        : "";

      let wardContent;

      if (matches.length === 0) {
        wardContent =
          '<div style="font-size:14px;font-weight:700;">Wards at this location</div>' +
          '<div style="margin-top:7px;color:#666;">' +
            'No mapped YSA ward was found at this location.' +
          '</div>';
      } else {
        const rows = matches.map((matchedWard) => (
          '<div style="display:flex;align-items:center;gap:7px;margin-top:7px;">' +
            '<span style="display:inline-block;width:11px;height:11px;border-radius:2px;' +
              'background:' + matchedWard.color + ';border:1px solid rgba(0,0,0,.35);"></span>' +
            '<div><strong>' + escapeHtml(matchedWard.name) + '</strong>' +
              '<span style="color:#666;margin-left:5px;">(' +
                escapeHtml(matchedWard.ageGroup) + ')</span></div>' +
          '</div>'
        )).join("");

        wardContent =
          '<div style="font-size:14px;font-weight:700;">Wards at this location</div>' +
          rows;
      }

      infoWindow.setContent(
        '<div style="font-family:Arial,sans-serif;min-width:210px;padding:2px 3px 4px;">' +
          locationHtml +
          wardContent +
        '</div>'
      );

      infoWindow.setPosition(latLng);
      infoWindow.open(map);
    }

    function getWardsAtLocation(latLng) {
      return wards.filter((ward) => {
        if (!ward.layer) return false;

        let containsPoint = false;
        ward.layer.forEach((feature) => {
          if (!containsPoint &&
              geometryContainsLatLng(feature.getGeometry(), latLng)) {
            containsPoint = true;
          }
        });

        return containsPoint;
      });
    }

    function geometryContainsLatLng(geometry, latLng) {
      if (!geometry) return false;

      const type = geometry.getType();

      if (type === "Polygon") {
        return polygonContainsLatLng(geometry, latLng);
      }

      if (type === "MultiPolygon") {
        return geometry.getArray().some(
          (polygon) => polygonContainsLatLng(polygon, latLng)
        );
      }

      if (type === "GeometryCollection") {
        return geometry.getArray().some(
          (part) => geometryContainsLatLng(part, latLng)
        );
      }

      return false;
    }

    function polygonContainsLatLng(polygon, latLng) {
      const rings = polygon.getArray();
      if (!rings || rings.length === 0) return false;

      if (!ringContainsLatLng(rings[0].getArray(), latLng)) {
        return false;
      }

      for (let i = 1; i < rings.length; i++) {
        if (ringContainsLatLng(rings[i].getArray(), latLng)) {
          return false;
        }
      }

      return true;
    }

    function ringContainsLatLng(path, latLng) {
      const x = latLng.lng();
      const y = latLng.lat();
      let inside = false;

      for (let i = 0, j = path.length - 1; i < path.length; j = i++) {
        const xi = path[i].lng();
        const yi = path[i].lat();
        const xj = path[j].lng();
        const yj = path[j].lat();

        const intersects =
          ((yi > y) !== (yj > y)) &&
          (x < ((xj - xi) * (y - yi)) /
            ((yj - yi) || Number.EPSILON) + xi);

        if (intersects) inside = !inside;
      }

      return inside;
    }

    function updateStatus() {
      const status = document.getElementById("statusBox");

      if (loadedWardCount === wards.length) {
        status.textContent = "All ward boundaries loaded.";
        setTimeout(() => {
          status.style.display = "none";
        }, 1600);
      } else {
        status.textContent =
          "Loaded " + loadedWardCount + " of " + wards.length + " ward layers…";
      }
    }

    function showLoadError(ward, detail) {
      const status = document.getElementById("statusBox");
      status.style.display = "block";
      status.innerHTML =
        '<span class="status-error">Could not load ' +
        escapeHtml(ward.file) +
        '.</span> ' +
        escapeHtml(detail || "");
    }

    function hexToRgba(hex, alpha) {
      const clean = hex.replace("#", "");
      const r = parseInt(clean.substring(0, 2), 16);
      const g = parseInt(clean.substring(2, 4), 16);
      const b = parseInt(clean.substring(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    window.initMap = initMap;
  </script>
